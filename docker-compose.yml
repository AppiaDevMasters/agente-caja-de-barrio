# Para correr el agente solo, en modo simulado o contra MCP ya levantados.
# El compose completo (db + MCP + panel) vive en backend-caja-de-barrio.
services:
  agente:
    build: .
    image: caja-de-barrio/agente
    container_name: agente
    env_file: .env
    ports:
      - "${AGENTE_PUERTO:-8088}:8080"
    restart: unless-stopped
